services:
  mongo:
    image: mongo:7
    container_name: kanban-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=deepak
      - MONGO_INITDB_ROOT_PASSWORD=deepak123
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: